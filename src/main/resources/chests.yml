# ============================================================
#  Chests – CS2-style cases, sold in the "Chests" section of the menu (/tigo chests).
#  A bought chest appears in front of the player. Right click: the lid opens and the items
#  scroll on a strip that slows down and stops on the prize.
#  After changes: /tigo reload   ·   Check for mistakes: /tigo check
# ============================================================
#
# CHEST SETTINGS (the key, e.g. "iron", is the id used by commands and placeholders):
#   name, icon (menu icon), glint (enchantment shine), color (#RRGGBB, frame in the menu)
#   price       : Cost (in the currency of config.yml: XP levels, Vault money or points)
#   order       : Position in the menu
#   description : Description lines
#   look        : Blocks of the chest that appears: body, trim (bands), latch (lock)
#   weights     : (optional) rarity weights for this chest only, e.g. { legendary: 2 }
#   rewards     : The prizes. Every prize has a rarity and one of:
#                 item: DIAMOND, amount: 1-99, name: "<value>Name", lore: [...], enchantments: { sharpness: 5 }
#                 levels: 10   (gives XP levels)
#                 weight: share among the prizes of the same rarity (default 1)
#
# ODDS: first a rarity is picked by its weight, then one prize of that rarity (like CS2 cases).
#   The share of rarities a chest does not contain goes to the others.

enabled: true
# How long the strip spins (seconds)
spin-seconds: 6
# An unopened chest disappears after this many seconds (or when its owner walks 24 blocks away)
# but stays in their chests: the OPEN button of the menu calls it back.
despawn-seconds: 120

# Rarities (most common first). Prizes of a rarity with announce: true are announced to the whole server.
rarities:
  common:
    name: "<#9AA4B2>Common"
    color: "#9AA4B2"
    weight: 79.92
  rare:
    name: "<#5F8FC4>Rare"
    color: "#5F8FC4"
    weight: 15.98
  epic:
    name: "<#9A6BC4>Epic"
    color: "#9A6BC4"
    weight: 3.2
  legendary:
    name: "<#D27A33>Legendary"
    color: "#D27A33"
    weight: 0.64
    announce: true
  mythic:
    name: "<#E0B54A>Mythic"
    color: "#E0B54A"
    weight: 0.26
    announce: true

chests:

  iron:
    name: "Iron Chest"
    icon: CHEST
    color: "#8E96A3"
    price: 5
    order: 1
    description:
      - "<body>Ideal for starting out."
      - "<body>Iron, food and a bit of luck."
    look:
      body: SPRUCE_PLANKS
      trim: IRON_BLOCK
      latch: IRON_BLOCK
    rewards:
      - { item: IRON_INGOT, amount: 8, rarity: common }
      - { item: BREAD, amount: 16, rarity: common }
      - { item: ARROW, amount: 32, rarity: common }
      - { item: COAL, amount: 24, rarity: common }
      - { levels: 3, rarity: common }
      - { item: GOLD_INGOT, amount: 8, rarity: rare }
      - item: IRON_PICKAXE
        name: "Swift Iron Pickaxe"
        enchantments: { efficiency: 3, unbreaking: 2 }
        rarity: rare
      - { levels: 8, rarity: rare }
      - { item: DIAMOND, amount: 3, rarity: epic }
      - { item: GOLDEN_APPLE, amount: 2, rarity: epic }
      - { item: DIAMOND, amount: 8, rarity: legendary }
      - { levels: 25, rarity: legendary }
      - { item: ENCHANTED_GOLDEN_APPLE, amount: 1, rarity: mythic }
      - { item: NETHERITE_SCRAP, amount: 1, rarity: mythic }

  diamond:
    name: "Diamond Chest"
    icon: CHEST
    glint: true
    color: "#5E9A94"
    price: 15
    order: 2
    description:
      - "<body>Diamonds, enchanted tools"
      - "<body>and a chance for a totem."
    look:
      body: DARK_OAK_PLANKS
      trim: DIAMOND_BLOCK
      latch: GOLD_BLOCK
    rewards:
      - { item: DIAMOND, amount: 1, rarity: common }
      - { item: EMERALD, amount: 8, rarity: common }
      - { item: ENDER_PEARL, amount: 4, rarity: common }
      - { item: GOLD_INGOT, amount: 12, rarity: common }
      - { levels: 10, rarity: common }
      - { item: DIAMOND, amount: 4, rarity: rare }
      - { item: GOLDEN_APPLE, amount: 3, rarity: rare }
      - item: DIAMOND_PICKAXE
        name: "Diamond Miner"
        enchantments: { efficiency: 4, unbreaking: 3 }
        rarity: rare
      - { levels: 20, rarity: rare }
      - item: DIAMOND_SWORD
        name: "Sharp Diamond Sword"
        enchantments: { sharpness: 5, unbreaking: 3 }
        rarity: epic
      - { item: TOTEM_OF_UNDYING, amount: 1, rarity: epic }
      - { levels: 35, rarity: epic }
      - { item: NETHERITE_SCRAP, amount: 4, rarity: legendary }
      - { item: DIAMOND_BLOCK, amount: 4, rarity: legendary }
      - { item: NETHERITE_INGOT, amount: 2, rarity: mythic }
      - { item: ENCHANTED_GOLDEN_APPLE, amount: 2, rarity: mythic }

  netherite:
    name: "Netherite Chest"
    icon: ENDER_CHEST
    glint: true
    color: "#8E7FB8"
    price: 35
    order: 3
    description:
      - "<body>The most valuable loot."
      - "<body>Elytra and Nether Star inside!"
    look:
      body: POLISHED_BLACKSTONE_BRICKS
      trim: NETHERITE_BLOCK
      latch: GOLD_BLOCK
    rewards:
      - { item: DIAMOND, amount: 5, rarity: common }
      - { item: ANCIENT_DEBRIS, amount: 2, rarity: common }
      - { item: EXPERIENCE_BOTTLE, amount: 32, rarity: common }
      - { levels: 25, rarity: common }
      - { item: NETHERITE_SCRAP, amount: 4, rarity: rare }
      - { item: TOTEM_OF_UNDYING, amount: 1, rarity: rare }
      - { levels: 45, rarity: rare }
      - { item: NETHERITE_INGOT, amount: 1, rarity: epic }
      - item: DIAMOND_PICKAXE
        name: "Deep Digger"
        enchantments: { efficiency: 5, fortune: 3, unbreaking: 3, mending: 1 }
        rarity: epic
      - { levels: 70, rarity: epic }
      - item: NETHERITE_SWORD
        name: "Midnight"
        enchantments: { sharpness: 5, unbreaking: 3, mending: 1 }
        rarity: legendary
      - { item: ELYTRA, amount: 1, rarity: legendary }
      - { item: NETHER_STAR, amount: 1, rarity: mythic }
      - { item: NETHERITE_INGOT, amount: 4, rarity: mythic }
      - { levels: 150, rarity: mythic }
