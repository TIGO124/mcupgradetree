# ============================================================
#  Chests – CS2 tarzı sandıklar. Menüde "Chests" bölümünde satılır (/tigo chests).
#  Satın alınan sandık oyuncunun önünde belirir, sağ tıklayınca kapağı açılır ve
#  eşyalar şeritte kayar; şerit yavaşlayıp kazanılan ödülde durur.
#  Değişikliklerden sonra: /tigo reload   •   Hata kontrolü: /tigo check
# ============================================================
#
# SANDIK AYARLARI:
#   name, icon (menüdeki simge), glint (parlama), color (#RRGGBB, menüdeki çerçeve)
#   Metinler (name, description, nadirlik adı, ödül name/lore) dile göre yazılabilir: { tr: "...", en: "..." }
#   price       : Bedel (config.yml currency: XP seviyesi, Vault parası veya puan)
#   order       : Menüdeki sıra
#   description : Açıklama satırları
#   look        : Önde beliren sandığın blokları: body (gövde), trim (bantlar), latch (kilit)
#   weights     : (isteğe bağlı) bu sandığa özel nadirlik ağırlıkları, ör. { efsanevi: 2 }
#   rewards     : Ödüller. Her ödülde rarity (nadirlik) ve şunlardan biri:
#                 item: DIAMOND, amount: 1-99, name: "<aqua>Ad", lore: [...], enchantments: { sharpness: 5 }
#                 levels: 10   (XP seviyesi verir)
#                 weight: aynı nadirlikteki ödüller arasındaki pay (varsayılan 1)
#
# ŞANS: Önce nadirlik ağırlığına göre bir nadirlik seçilir, sonra o nadirlikteki ödüllerden biri
#   (CS2 kasaları gibi). Sandıkta olmayan nadirliklerin payı diğerlerine dağılır.

enabled: true
# Şeridin dönme süresi (saniye)
spin-seconds: 6
# Açılmayan sandık bu kadar saniye sonra (veya oyuncu 24 bloktan uzaklaşınca) kaybolur
# ama sandıklarında kalır: menüdeki AÇ butonu ile tekrar çağrılır.
despawn-seconds: 120

# Nadirlikler (yaygından nadire). announce: true olanlar tüm sunucuya duyurulur.
rarities:
  yaygin:
    name: { tr: "<#4B69FF>Yaygın", en: "<#4B69FF>Common" }
    color: "#4B69FF"
    weight: 79.92
  nadir:
    name: { tr: "<#8847FF>Nadir", en: "<#8847FF>Rare" }
    color: "#8847FF"
    weight: 15.98
  destansi:
    name: { tr: "<#D32CE6>Destansı", en: "<#D32CE6>Epic" }
    color: "#D32CE6"
    weight: 3.2
  efsanevi:
    name: { tr: "<#EB4B4B>Efsanevi", en: "<#EB4B4B>Legendary" }
    color: "#EB4B4B"
    weight: 0.64
    announce: true
  mitik:
    name: { tr: "<#FFD700>★ Mitik", en: "<#FFD700>★ Mythic" }
    color: "#FFD700"
    weight: 0.26
    announce: true

chests:

  demir:
    name: { tr: "<#E5E7EB>Demir Sandık", en: "<#E5E7EB>Iron Chest" }
    icon: CHEST
    color: "#9CA3AF"
