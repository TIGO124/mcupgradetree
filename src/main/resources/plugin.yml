name: UpgradeTree
version: '${version}'
main: com.upgradetree.UpgradeTreePlugin
api-version: '26.2'
author: TIGO124
description: Roblox tarzı, animasyonlu altıgen yükseltme ağacı (sandık menüsü yerine oyuncunun önünde süzülen panel).
softdepend: [Vault, PlaceholderAPI, floodgate, Geyser-Spigot]
commands:
  yukselt:
    description: Yükseltme ağacını açar / kapatır.
    usage: /<command> [yardim]
    aliases: [upgrade, upgrades, agac, upgradetree, ut]
permissions:
  upgradetree.use:
    description: Yükseltme ağacını açabilir.
    default: true
  upgradetree.admin:
    description: Yönetici komutları (yenile, kontrol, sifirla, ayarla, puan, prestij ayarla, temizle, npc, top koy, debug).
    default: op
