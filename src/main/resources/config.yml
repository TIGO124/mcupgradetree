# ============================================================
#  UpgradeTree - Roblox-style hexagon upgrade tree
#  Trees (upgrades, costs, effects) live in the trees/ folder; every file is a tab of the menu.
#  Chests: chests.yml   ·   Loot bags: lootbags.yml   ·   Messages: messages.yml   ·   After changes: /tigo reload
# ============================================================

# Written by the plugin, do not change. An older config.yml is rewritten with these comments
# (your values are kept, the old file is saved as config.yml.bak).
config-version: 2

currency:
  # XP_LEVELS -> pay with experience levels (no other plugin needed)
  # VAULT     -> pay with money (needs Vault and an economy plugin such as EssentialsX or CMI)
  # POINTS    -> the plugin's own upgrade points (earned as set under "points" below)
  type: XP_LEVELS
  # Currency name shown in the panel and in messages. Empty = the name from messages.yml
  # (Levels, Points or Money). A fixed name: "Diamonds"
  name: ""
  # Symbol in front of the amount in the panel (empty = no symbol)
  symbol: ""

points:
  # Points are only earned while currency.type is POINTS
  starting-points: 0
  per-mob-kill: 0.3
  per-player-kill: 3
  # Points per mob type (mobs not listed get per-mob-kill, 0 = no points)
  mob-points:
    WITHER: 50
    ENDER_DRAGON: 100
    ELDER_GUARDIAN: 20
    WARDEN: 40
    BAT: 0
  # Mobs spawned these ways give no points and no mob loot bonus (farm protection)
  ignored-spawn-reasons:
    - SPAWNER
    - SPAWNER_EGG
    - SLIME_SPLIT
    - BUILD_IRONGOLEM
    - BUILD_SNOWMAN
    - TRIAL_SPAWNER
  # Seconds before killing the same player gives points again (alt account protection)
  player-kill-cooldown: 600
  # Playtime reward (a player who has not moved for 5 minutes counts as AFK)
  playtime:
    every-minutes: 10
    amount: 1
  # Mining natural ores (blocks placed by players do not count)
  mining:
    amount: 0.2
    blocks: ["#coal_ores", "#iron_ores", "#copper_ores", "#gold_ores", "#redstone_ores",
             "#lapis_ores", "#diamond_ores", "#emerald_ores", NETHER_GOLD_ORE, NETHER_QUARTZ_ORE]
  # For every new advancement
  advancement: 2
  # Once a day, on the first join of the day (/tigo daily)
  daily: 3

prestige:
  enabled: true
  # How many percent of the tree levels must be filled for the prestige button
  required-percent: 100
  max: 10
  # Costs grow by this much with every prestige (0.1 = 10%)
  cost-increase: 0.1
  # Reset the points too on prestige (POINTS)
  reset-points: false
  # Permanent bonuses per prestige level (written like the effects of the tree files)
  effects:
    - type: XP_BOOST
      amount: 0.03
    - type: ATTRIBUTE
      attribute: max_health
      amount: 0.5
  # Console commands run on prestige ({player} {uuid} {prestige})
  commands: []

respec:
  # Players can reset their upgrades and get part of the cost back
  enabled: true
  refund-percent: 75
  # Seconds between two resets. A long wait stops ability swapping right before a fight.
  cooldown: 21600

menu:
  # AUTO    -> chest menu for Bedrock players (Geyser/Floodgate), 3D panel for everyone else
  # DISPLAY -> 3D panel for everyone      CHEST -> chest menu for everyone
  # Players can pick their own with /tigo menu panel|chest
  mode: AUTO
  # Distance of the panel from the player when it opens (blocks). It moves closer by itself in front of a wall.
  distance: 1.6
  # Size of the panel on screen (use 0.9 if it does not fit on 4:3 screens)
  scale: 1.0
  # Progressive reveal: an upgrade appears once one of the upgrades it requires is bought
  progressive-reveal: true
  # Does clicking an upgrade buy it? false: the click selects it, the BUY button buys it
  click-to-buy: true
  # Upgrades costing this much or more need a second click to confirm (0 = off). Chests are bought with one click.
  confirm-cost: 10
  close-on-damage: true
  # false: the panel stays where it opened and the player walks freely (clicks go to the menu while looking at it)
  # true : the player cannot move until the menu is closed
  lock-player: false
  # The menu closes when the player walks this many blocks away from the panel
  max-distance: 8
  # Seconds after combat before the menu can be opened
  combat-cooldown: 8
  # Hide the held item while the menu is open (so it does not cover the panel)
  hide-hand: true
  glow-on-hover: true
  sounds: true
  particles: true
  animations: true
  # HIGH: a ring around finished upgrades  ·  LOW: fewer entities (busy servers)
  quality: HIGH
  # Ready-made look (menu colours and message colours change together):
  #   NIGHT     night glass: dark blue see-through panels, ice blue lines, gold for finished upgrades
  #   CELESTIAL near black panels with champagne gold
  #   MINIMAL   black and white, thin frames, colour only where it means something
  #   WOOD      walnut planks with a brass frame
  style: NIGHT
  # Background of the panel:
  #   IMAGE  the picture below (sent to players in a small resource pack, see resource-pack)
  #   NONE   the plain colour of the style    STARS  stars    PLANKS  wooden planks
  # Players who do not accept the resource pack see the plain colour.
  background: IMAGE
  # Picture in plugins/UpgradeTree (PNG or JPG). Its middle is cut to the shape of the panel (2:1).
  # After changing it: /tigo reload, the new pack is sent to online players by itself.
  background-image: background.jpg

# The background picture reaches players in a resource pack, also written to plugins/UpgradeTree/resourcepack.zip.
resource-pack:
  # SELF_HOST: the plugin serves the pack from its own small web server (the port below must be open to
  #            the outside; hosting panels may need an extra port)
  # URL      : upload resourcepack.zip somewhere (website, GitHub release...) and put its address in url
  # EXTERNAL : add the contents of the pack to the server's own resource pack yourself; the plugin sends nothing
  # OFF      : no picture
  mode: SELF_HOST
  port: 8164
  # Address players download the pack from (empty = the address the player joined with). Behind a
  # reverse proxy a full address works too: "https://pack.myserver.com"
  host: ""
  url: ""
  # true: players who decline the pack cannot join
  required: false

# Override single colours of the style (#RRGGBB; #AARRGGBB mixes the colour into the panel background).
# Missing ones come from the style.
# Keys: background, panel-border, header, card, locked, line, hidden-line, buy, deny, gold (frame of an owned
# upgrade), maxed (finished), hover, tint (how much of an upgrade's own colour shows, 0-1)
theme: {}

access:
  # Right clicking this item opens the menu (given on join, cannot be dropped)
  item:
    enabled: false
    material: NETHER_STAR
    slot: 8
    # Empty: access-item-name of messages.yml
    name: ""
  # Right clicking an entity (NPC, villager, armor stand...) with this tag opens the menu.
  # To tag the entity you are looking at: /tigo npc
  entity-tag: upgradetree_npc
  # The Options > Controls > Quick Actions key opens a small window whose "Open the tree" button opens the tree.
  # Takes effect after a restart.
  quick-action: true

notify:
  # Tell the player on the action bar when a new upgrade can be bought
  enabled: true
  # Minimum seconds between two notifications
  cooldown: 120

restrictions:
  # Upgrades do nothing and the menu is closed in these worlds (minigames, PvP arenas...)
  disabled-worlds: []

leaderboard:
  size: 10
  # The hologram position is set in game with /tigo top place
  hologram: ""

storage:
  # YAML (files), SQLITE (one database file) or MYSQL (shared data across a server network)
  # Restart the server after changing it. Old YAML data is copied into an empty database by itself.
  type: YAML
  autosave-seconds: 60
  table: upgradetree_players
  mysql:
    host: localhost
    port: 3306
    database: minecraft
    user: root
    password: ""
    params: "useSSL=false&autoReconnect=true"

effects:
  # Blocks of DOUBLE_DROP and AUTO_SMELT effects that list no "blocks" of their own
  double-drop-blocks: ["#coal_ores", "#iron_ores", "#copper_ores", "#gold_ores", "#redstone_ores",
                       "#lapis_ores", "#diamond_ores", "#emerald_ores", NETHER_GOLD_ORE, NETHER_QUARTZ_ORE]
  # Blocks of VEIN_MINER effects that list no "blocks" of their own
  vein-miner-blocks: ["#coal_ores", "#iron_ores", "#copper_ores", "#gold_ores", "#redstone_ores",
                      "#lapis_ores", "#diamond_ores", "#emerald_ores", NETHER_GOLD_ORE, NETHER_QUARTZ_ORE, ANCIENT_DEBRIS]
  # Most logs cut at once by tree felling
  tree-feller-max: 96

update:
  # /tigo update installs the newest release of this GitHub repository (owner/name). The new version
  # starts with the next server restart (/tigo update restart restarts right away). Nothing is lost:
  # player data is saved and plugins/UpgradeTree/backups gets a copy of this folder and the old jar.
  repository: TIGO124/mcupgradetree
  # Only for a private repository: a GitHub token that can read it (fine-grained, Contents: Read-only)
  token: ""

# Before removing the plugin set this to true and /tigo reload: every bonus of the plugin is removed
# from players as they join (/tigo cleanup all for players who are online).
cleanup-mode: false
