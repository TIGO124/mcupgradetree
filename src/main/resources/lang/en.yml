disabled-world: "<red>Upgrades are disabled in this world."
opened-hint: "<gray>Aim at an upgrade with your crosshair, <white>left click</white> to buy. The panel stays put, you can walk freely. <white>Look at it and sneak</white> to close."
reloaded: "<green>Configuration reloaded. <gray>({trees} trees, {nodes} upgrades)"
reload-failed: "<red>Reload failed, check the console."
reset-done: "<green>All upgrades of <white>{player}</white> were reset."
