# UpgradeTree messages (English). MiniMessage format: <red>, <#FF8800>, <gradient:#A:#B>, <b> ...
# Legacy & colour codes (&a, &l, &#FF8800) work too. After changes: /tigo reload
# lang-version: the plugin backs up an older copy of this file and writes a new one; do not edit.
lang-version: 4

prefix: "<dark_gray>[<gradient:#7DD3FC:#C084FC>Upgrades</gradient><dark_gray>]</dark_gray> "
no-permission: "<red>You don't have permission to do that."
players-only: "<red>Only players can use this command."
