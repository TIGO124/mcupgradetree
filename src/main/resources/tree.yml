# ============================================================
#  Yükseltme ağacı
#  Değişikliklerden sonra: /yukselt yenile
# ============================================================
#
# Her düğümün ayarları:
#   name            : Görünen ad (MiniMessage veya & renk kodları)
#   icon            : Eşya adı (DIAMOND, IRON_SWORD, GOLDEN_APPLE ...)
#   x, y            : Konum. x = sütun (soldan sağa), y = satır (yukarıdan aşağıya).
#                     Ondalık değerler de olur (ör. 1.5). Panel ağacı otomatik ölçekler.
#   max-level       : En yüksek seviye
#   cost            : İlk seviyenin bedeli
#   cost-increase   : Her seviyede bedele eklenen miktar   (bedel = cost + seviye * cost-increase)
#   cost-multiplier : İstersen çarpan da verebilirsin       (bedel = cost * çarpan^seviye + ...)
#   costs           : Ya da her seviyeyi tek tek yaz: [2, 3, 5, 8]
#   requires        : Açılması için en az 1 seviyesi alınmış olması gereken düğümler
#   color           : Satın alınınca düğümün rengi (#RRGGBB)
#   description     : Bilgi panelinde görünen açıklama satırları
#   bonus           : Bilgi panelindeki "şu an → sonraki" satırı. {value} yerine değer yazılır.
#   bonus-multiplier: Gösterilen değeri çarpar (ör. can için 0.5 = kalp, yüzde için 100)
#   bonus-per-level : Seviye başına gösterilecek değeri elle ver (iksirler için kullanışlı)
#
# Efekt tipleri (miktarlar SEVİYE BAŞINADIR):
#   - type: ATTRIBUTE              # Oyuncu özelliği
#     attribute: max_health        # max_health, attack_damage, attack_speed, armor, armor_toughness,
#                                  # movement_speed, luck, knockback_resistance, block_break_speed,
#                                  # mining_efficiency, jump_strength, safe_fall_distance, oxygen_bonus ...
#     amount: 2
#     operation: ADD_NUMBER        # ADD_NUMBER (düz ekleme), ADD_SCALAR (yüzde, 0.1 = %10)
#   - type: POTION                 # Kalıcı iksir efekti
#     effect: regeneration         # speed, haste, strength, resistance, night_vision, regeneration ...
#     amplifier: 0                 # 0 = I, 1 = II
#     amplifier-per-level: 1       # Her seviyede güç artışı
#   - type: XP_BOOST               # Ekstra XP, 0.1 = seviye başına %10
#     amount: 0.1
#   - type: DOUBLE_DROP            # Cevherlerden iki kat ganimet şansı, 0.05 = seviye başına %5
#     amount: 0.05
#   - type: COMMAND                # Her seviye alındığında konsoldan komut
#     commands:
#       - "give {player} diamond 1"
#       - "lp user {player} permission set ozel.yetki"
#     # Yer tutucular: {player} {uuid} {level} {node}

title: "<gradient:#FFE259:#FFA751><b>YÜKSELTME AĞACI</b></gradient>"

nodes:

  baslangic:
    name: "<gradient:#FFE259:#FFA751>Başlangıç</gradient>"
