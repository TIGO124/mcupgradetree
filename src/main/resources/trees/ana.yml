# ============================================================
#  Ana ağaç (menüde bir sekme). Her .yml dosyası trees/ içinde ayrı bir sekmedir.
#  Değişikliklerden sonra: /tigo reload   •   Hata kontrolü: /tigo check
# ============================================================
#
# KONUM (altıgen ızgara):
#   x, y : Yan komşu x±1 (aynı y). Çapraz komşu x±0.5 ve y±1.
#          Ardışık satırlar yarım kayar: y çift ise x tam sayı, y tek ise x buçuklu (0.5, 1.5 ...).
#          Panel ağacı otomatik ölçekler.
#
# DÜĞÜM AYARLARI:
#   name, icon, color (#RRGGBB), description, max-level
#   icon-model     : Kaynak paketi modeli (ör. "sunucum:kilic")    icon-texture: kafa dokusu (base64)
#   cost, cost-increase, cost-multiplier, costs: [2, 3, 5]   (bedel = cost * çarpan^seviye + artış * seviye)
#   requires       : Hepsinden en az 1 seviye gerekir
#   requires-any   : Bunlardan biri yeter
#   requires-level : { keskinlik: 3 }  belirli seviye gerekir
#   exclusive-with : Bunlardan biri alındıysa bu alınamaz (sınıf seçimi)
#   permission     : Yetki gerekir          min-prestige: Prestij seviyesi gerekir
#   always-visible : true ise kademeli açılmada baştan görünür
#   bonus          : "şu an → sonraki" satırı ({value})   bonus-multiplier / bonus-per-level
#
# DİL: title, tab.name, name, description ve bonus her dil için ayrı yazılabilir:
#   name: { tr: "Keskin Kılıç", en: "Sharp Sword" }
#   description: { tr: ["<gray>Türkçe satır"], en: ["<gray>English line"] }
#   Oyuncu kendi dilindekini görür (/tigo language). O dilde yoksa sunucu dili, o da yoksa ilk yazılan.
#   Tek bir yazı ("Titan") her dilde aynı görünür. Yeni dil (ör. de) için sadece de: satırları eklenir.
#
# KADEMELİ AÇILMA: Bir düğüm, gösterdiği (requires/requires-any/requires-level) düğümlerden
#   biri alınınca görünür. Kök düğümler (gereksinimsiz) her zaman görünür.
#
# EFEKTLER (miktarlar SEVİYE BAŞINA):
#   ATTRIBUTE   attribute: max_health | attack_damage | attack_speed | armor | armor_toughness | luck
#               movement_speed | knockback_resistance | block_break_speed | mining_efficiency
#               submerged_mining_speed | jump_strength | safe_fall_distance | fall_damage_multiplier
#               step_height | scale | block_interaction_range | entity_interaction_range
#               sweeping_damage_ratio | oxygen_bonus | water_movement_efficiency | burning_time ...
#               amount, operation: ADD_NUMBER (düz) | ADD_SCALAR (yüzde, 0.1 = %10)
#   POTION      effect: speed | haste | strength | resistance | night_vision | regeneration ...
#               amplifier (0 = I), amplifier-per-level
#   XP_BOOST    amount: 0.1 = +%10 XP           DOUBLE_DROP  amount: şans, blocks: [..] veya "#logs"
#   CRIT        amount: şans, multiplier: 1.5   LIFESTEAL    amount: verilen hasarın oranı
#   DODGE       amount: saldırıdan kaçma şansı  AUTO_SMELT   amount: cevheri eritme şansı
#   VEIN_MINER  amount: blok sayısı (eğilerek)  TREE_FELLER  amount: kütük sayısı (eğilerek)
#   MOB_DROPS   amount: mob ganimeti x2 şansı   KEEP_XP      amount: ölünce kalan XP oranı
#   KEEP_INVENTORY amount: eşyaları koruma şansı  HUNGER_SAVE amount: açlık harcamama şansı
#   ABILITY     ability: DASH | LEAP | HEAL | SHIELD | SPEED | NOVA
#               trigger: SNEAK_SWAP (Shift+F) | DOUBLE_SNEAK (çift Shift) | SNEAK_JUMP (Shift+Zıpla)
#               cooldown, cooldown-per-level, power, power-per-level   (her tetik için bir yetenek)
#   COMMAND     commands: ["give {player} diamond 1"]  ({player} {uuid} {level} {node})

