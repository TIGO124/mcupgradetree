# ============================================================
#  Main tree (one tab of the menu). Every .yml file in trees/ is a tab of its own.
#  After changes: /tigo reload   ·   Check for mistakes: /tigo check
# ============================================================
#
# POSITION (hexagon grid):
#   x, y : Side neighbours are x±1 (same y). Diagonal neighbours are x±0.5 and y±1.
#          Rows are offset by half a cell: on even rows x is a whole number, on odd rows it ends in .5
#          (0.5, 1.5 ...). The panel scales the tree to fit.
#
# UPGRADE SETTINGS (the key, e.g. "sharp_sword", is the id used by commands and placeholders):
#   name, icon, color (#RRGGBB), description, max-level
#   icon-model     : Resource pack item model (e.g. "myserver:sword")    icon-texture: player head texture (base64)
#   cost, cost-increase, cost-multiplier, costs: [2, 3, 5]   (cost = cost * multiplier^level + increase * level)
#   requires       : Every one of these needs at least level 1
#   requires-any   : One of these is enough
#   requires-level : { sharp_sword: 3 }  needs a certain level
#   exclusive-with : Can't be bought while one of these is owned (class choice)
#   permission     : Needs a permission          min-prestige: needs a prestige level
#   always-visible : true = visible from the start (progressive reveal)
#   bonus          : The "now → next" line of the info card ({value})   bonus-multiplier / bonus-per-level
#
# PROGRESSIVE REVEAL: an upgrade appears once one of the upgrades it points to
#   (requires / requires-any / requires-level) is bought. Upgrades without requirements are always visible.
#
# EFFECTS (amounts are PER LEVEL):
#   ATTRIBUTE   attribute: max_health | attack_damage | attack_speed | armor | armor_toughness | luck
#               movement_speed | knockback_resistance | block_break_speed | mining_efficiency
#               submerged_mining_speed | jump_strength | safe_fall_distance | fall_damage_multiplier
#               step_height | scale | block_interaction_range | entity_interaction_range
#               sweeping_damage_ratio | oxygen_bonus | water_movement_efficiency | burning_time ...
#               amount, operation: ADD_NUMBER (flat) | ADD_SCALAR (percent, 0.1 = 10%)
#   POTION      effect: speed | haste | strength | resistance | night_vision | regeneration ...
#               amplifier (0 = I), amplifier-per-level
#   XP_BOOST    amount: 0.1 = +10% XP              DOUBLE_DROP  amount: chance, blocks: [..] or "#logs"
#   CRIT        amount: chance, multiplier: 1.5    LIFESTEAL    amount: share of the damage dealt
#   DODGE       amount: chance to dodge a hit      AUTO_SMELT   amount: chance to smelt the ore
#   VEIN_MINER  amount: blocks (while sneaking)    TREE_FELLER  amount: logs (while sneaking)
#   MOB_DROPS   amount: chance of double mob loot  KEEP_XP      amount: share of XP kept on death
#   KEEP_INVENTORY amount: chance to keep items    HUNGER_SAVE  amount: chance to lose no hunger
#   ABILITY     ability: DASH | LEAP | HEAL | SHIELD | SPEED | NOVA
#               trigger: SNEAK_SWAP (Sneak + F) | DOUBLE_SNEAK (sneak twice) | SNEAK_JUMP (Sneak + Jump)
#               cooldown, cooldown-per-level, power, power-per-level   (one ability per trigger)
#   COMMAND     commands: ["give {player} diamond 1"]  ({player} {uuid} {level} {node})

title: "<b>UPGRADE TREE</b>"
tab:
