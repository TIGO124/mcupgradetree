# Toplayıcılık: kazı, odun, tarım. Damar kazma ve ağaç kesme eğilerek (Shift) çalışır.
# Ayrıntılı açıklama: trees/ana.yml başındaki yorumlar.

title: { tr: "<gradient:#FCD34D:#86EFAC><b>TOPLAYICI</b></gradient>", en: "<gradient:#FCD34D:#86EFAC><b>GATHERER</b></gradient>" }
tab:
  name: { tr: "<white>Toplayıcı", en: "<white>Gatherer" }
  icon: GOLDEN_PICKAXE
  order: 3

nodes:

  toplayici:
    name: { tr: "<gradient:#FCD34D:#FBBF24>Toplayıcı</gradient>", en: "<gradient:#FCD34D:#FBBF24>Gatherer</gradient>" }
    icon: GOLDEN_PICKAXE
    x: 0
    y: 0
    max-level: 3
    cost: 3
    cost-increase: 2
    requires: [madenci]
    always-visible: true
    color: "#D97706"
    description:
      tr:
        - "<gray>Kazmaların daha"
        - "<gray>verimli çalışır."
      en:
        - "<gray>Your pickaxes work"
        - "<gray>more efficiently."
    bonus: { tr: "+{value} verimlilik", en: "+{value} efficiency" }
    effects:
      - type: ATTRIBUTE
        attribute: mining_efficiency
        amount: 1

  damar:
    name: { tr: "<#FCD34D>Damar Avcısı", en: "<#FCD34D>Vein Hunter" }
    icon: DIAMOND_PICKAXE
    x: 1
    y: 0
    max-level: 4
    cost: 5
    cost-increase: 3
    requires: [toplayici]
    color: "#F59E0B"
    description:
      tr:
        - "<white>Eğilerek</white> <gray>bir cevher kır,"
        - "<gray>bitişik damar da kırılsın."
      en:
        - "<white>Sneak</white> <gray>and break an ore,"
        - "<gray>the whole vein breaks too."
    bonus: { tr: "+{value} blok", en: "+{value} blocks" }
    effects:
      - type: VEIN_MINER
        amount: 4

  eritici:
    name: { tr: "<#FCD34D>Erimiş Kazma", en: "<#FCD34D>Molten Pickaxe" }
    icon: BLAST_FURNACE
    x: 2
    y: 0
    max-level: 4
    cost: 5
    cost-increase: 2
    requires: [damar]
    color: "#F59E0B"
    description:
      tr:
        - "<gray>Cevherler kırılırken"
        - "<gray>eriyip külçe olur."
      en:
        - "<gray>Ores melt into ingots"
        - "<gray>as you break them."
    bonus: { tr: "%{value} şans", en: "{value}% chance" }
    bonus-multiplier: 100
    effects:
      - type: AUTO_SMELT
        amount: 0.25

  hiz_tutkusu:
    name: { tr: "<#FCD34D>Hız Tutkusu", en: "<#FCD34D>Need for Speed" }
    icon: GOLDEN_SHOVEL
    x: 0.5
    y: -1
    max-level: 2
    cost: 8
    cost-increase: 8
    requires: [toplayici]
    color: "#F59E0B"
    description:
      tr:
        - "<gray>Kalıcı <yellow>Acele I</yellow> ve"
        - "<gray>daha hızlı kazma."
      en:
        - "<gray>Permanent <yellow>Haste I</yellow> and"
        - "<gray>faster mining."
    bonus: { tr: "+%{value} kazma hızı", en: "+{value}% mining speed" }
    bonus-multiplier: 100
    effects:
      - type: ATTRIBUTE
        attribute: block_break_speed
        amount: 0.05
        operation: ADD_SCALAR
      - type: POTION
        effect: haste
        amplifier: 0

  olta:
    name: { tr: "<#93C5FD>Şanslı Olta", en: "<#93C5FD>Lucky Rod" }
    icon: FISHING_ROD
    x: -0.5
    y: -1
    max-level: 3
    cost: 3
    cost-increase: 2
    requires: [toplayici]
    color: "#0EA5E9"
    description:
      tr:
        - "<gray>Balık tutarken daha"
        - "<gray>iyi ganimet çıkar."
      en:
        - "<gray>Better loot"
        - "<gray>when fishing."
    bonus: { tr: "+{value} şans", en: "+{value} luck" }
    bonus-per-level: 0.5
    effects:
      - type: ATTRIBUTE
        attribute: luck
        amount: 0.5

  oduncu:
    name: { tr: "<#A3E635>Oduncu", en: "<#A3E635>Lumberjack" }
    icon: IRON_AXE
    x: -1
    y: 0
    max-level: 4
    cost: 4
    cost-increase: 2
    requires: [toplayici]
    color: "#65A30D"
    description:
      tr:
        - "<white>Eğilerek</white> <gray>bir kütük kır,"
        - "<gray>bütün ağaç düşsün."
      en:
        - "<white>Sneak</white> <gray>and break a log,"
        - "<gray>the whole tree falls."
    bonus: { tr: "+{value} kütük", en: "+{value} logs" }
    effects:
      - type: TREE_FELLER
        amount: 16

  orman:
    name: { tr: "<#A3E635>Orman Bekçisi", en: "<#A3E635>Forest Keeper" }
    icon: OAK_SAPLING
    x: -2
    y: 0
    max-level: 3
    cost: 4
    cost-increase: 2
    requires: [oduncu]
    color: "#65A30D"
    description:
      tr:
        - "<gray>Kütüklerden iki kat"
        - "<gray>odun düşme şansı."
      en:
        - "<gray>A chance for double"
        - "<gray>wood from logs."
    bonus: { tr: "%{value} şans", en: "{value}% chance" }
    bonus-multiplier: 100
    effects:
      - type: DOUBLE_DROP
        amount: 0.1
        blocks: ["#logs"]

  bereket:
    name: { tr: "<#86EFAC>Bereket", en: "<#86EFAC>Bounty" }
    icon: WHEAT
    x: 0.5
    y: 1
    max-level: 4
    cost: 3
    cost-increase: 2
    requires: [toplayici]
    color: "#16A34A"
    description:
      tr:
        - "<gray>Olgun ekinlerden iki"
        - "<gray>kat ürün şansı."
      en:
        - "<gray>A chance for double"
        - "<gray>crops from ripe plants."
    bonus: { tr: "%{value} şans", en: "{value}% chance" }
    bonus-multiplier: 100
    effects:
      - type: DOUBLE_DROP
        amount: 0.08
        blocks: [WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART, COCOA]

  bahcivan:
    name: { tr: "<#86EFAC>Yeşil Parmak", en: "<#86EFAC>Green Thumb" }
    icon: MELON_SLICE
    x: -0.5
    y: 1
    max-level: 3
    cost: 3
    cost-increase: 2
    requires: [toplayici]
    color: "#16A34A"
    description:
      tr:
        - "<gray>Kavun, balkabağı ve"
        - "<gray>kamıştan iki kat ürün."
      en:
        - "<gray>Double drops from melons,"
        - "<gray>pumpkins and sugar cane."
    bonus: { tr: "%{value} şans", en: "{value}% chance" }
    bonus-multiplier: 100
    effects:
      - type: DOUBLE_DROP
        amount: 0.08
        blocks: [MELON, PUMPKIN, SUGAR_CANE, CACTUS, BAMBOO, SWEET_BERRY_BUSH]
