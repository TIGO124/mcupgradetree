# Aktif yetenekler. Her tetik için bir yetenek seçilir (exclusive-with ile sınıf seçimi).
#   Shift + F       -> SNEAK_SWAP      Çift Shift -> DOUBLE_SNEAK      Shift + Zıpla -> SNEAK_JUMP
# Ayrıntılı açıklama: trees/ana.yml başındaki yorumlar.

title: "<gradient:#FDBA74:#F472B6><b>YETENEKLER</b></gradient>"
tab:
  name: "<white>Yetenekler"
  icon: BLAZE_POWDER
  order: 2

nodes:

  yetenek_kapisi:
    name: "<gradient:#FDBA74:#FB923C>Yetenek Kapısı</gradient>"
    icon: BLAZE_ROD
    x: 0
    y: 0
    max-level: 1
    cost: 3
    requires: [baslangic]
    always-visible: true
    color: "#F97316"
    description:
      - "<gray>Aktif yeteneklerin"
      - "<gray>kilidini açar."
    effects:
      - type: ATTRIBUTE
        attribute: attack_damage
        amount: 0.5

  atilma:
    name: "<#FDBA74>Atılma"
    icon: WIND_CHARGE
    x: 1
    y: 0
    max-level: 3
    cost: 5
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [hiz_patlamasi]
    color: "#F97316"
    description:
      - "<white>Shift + F</white><gray>: baktığın"
      - "<gray>yöne hızla atıl."
    bonus: "Güç {value}"
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: DASH
        trigger: SNEAK_SWAP
        cooldown: 12
        cooldown-per-level: -2
        power: 1
        power-per-level: 0.3

  hiz_patlamasi:
    name: "<#FDBA74>Hız Patlaması"
    icon: SUGAR
    x: 0.5
    y: -1
    max-level: 3
    cost: 5
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [atilma]
    color: "#F97316"
    description:
      - "<white>Shift + F</white><gray>: kısa süre"
      - "<gray>çok hızlı koş."
    bonus: "Hız {value}"
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: SPEED
        trigger: SNEAK_SWAP
        cooldown: 30
        cooldown-per-level: -5
        power: 1
        power-per-level: 1

  sicrama:
    name: "<#F0ABFC>Sıçrama"
    icon: GOAT_HORN
    x: -1
    y: 0
    max-level: 3
    cost: 5
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [sok_dalgasi]
    color: "#D946EF"
    description:
      - "<white>Shift + Zıpla</white><gray>: havaya"
      - "<gray>fırla, düşme hasarı yok."
    bonus: "Güç {value}"
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: LEAP
        trigger: SNEAK_JUMP
        cooldown: 15
        cooldown-per-level: -3
        power: 1
        power-per-level: 0.4

  sok_dalgasi:
    name: "<#F0ABFC>Şok Dalgası"
    icon: TNT
    x: -0.5
    y: -1
    max-level: 3
    cost: 6
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [sicrama]
    color: "#D946EF"
    description:
      - "<white>Shift + Zıpla</white><gray>: yakındaki"
      - "<gray>canavarları savur."
    bonus: "Güç {value}"
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: NOVA
        trigger: SNEAK_JUMP
        cooldown: 25
        cooldown-per-level: -4
        power: 1
        power-per-level: 0.5

  sifa:
    name: "<#86EFAC>Şifa"
    icon: GLISTERING_MELON_SLICE
    x: 0.5
    y: 1
    max-level: 3
    cost: 6
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [kalkan]
    color: "#10B981"
    description:
      - "<white>Çift Shift</white><gray>: canını"
      - "<gray>hemen doldur."
    bonus: "+{value} ❤"
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: HEAL
        trigger: DOUBLE_SNEAK
        cooldown: 45
        cooldown-per-level: -8
        power: 1
        power-per-level: 0.5

  kalkan:
    name: "<#86EFAC>Kalkan"
    icon: SHIELD
    x: -0.5
    y: 1
    max-level: 3
    cost: 6
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [sifa]
    color: "#10B981"
    description:
      - "<white>Çift Shift</white><gray>: kısa süre"
      - "<gray>ekstra can ve direnç."
    bonus: "Kalkan {value}"
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: SHIELD
        trigger: DOUBLE_SNEAK
        cooldown: 40
        cooldown-per-level: -6
        power: 1
        power-per-level: 1

  savasci:
    name: "<#FDBA74>Usta Savaşçı"
    icon: MACE
    x: 2
    y: 0
    max-level: 3
    cost: 8
    cost-increase: 4
    requires-any: [atilma, hiz_patlamasi]
    color: "#EA580C"
    description:
      - "<gray>Hareket ederken daha"
      - "<gray>sık kritik vurursun."
    bonus: "%{value} kritik"
    bonus-multiplier: 100
    effects:
      - type: CRIT
        amount: 0.04
        multiplier: 1.6

  ruh:
    name: "<#F0ABFC>Rüzgâr Ruhu"
    icon: ELYTRA
    x: -2
    y: 0
    max-level: 3
    cost: 8
    cost-increase: 4
    requires-any: [sicrama, sok_dalgasi]
    color: "#C026D3"
    description:
      - "<gray>Düşüşlerin hafifler,"
      - "<gray>daha güvenli inersin."
    bonus: "+{value} güvenli düşüş"
    effects:
      - type: ATTRIBUTE
        attribute: safe_fall_distance
        amount: 2

  kutsal_isik:
    name: "<gradient:#6EE7B7:#A7F3D0><b>Kutsal Işık</b></gradient>"
    icon: BEACON
    x: 0
    y: 2
    max-level: 1
    cost: 20
    requires-any: [sifa, kalkan]
    color: "#059669"
    description:
      - "<gray>Kalıcı yenilenme ve"
      - "<gray>ateş direnci."
    effects:
      - type: POTION
        effect: regeneration
        amplifier: 0
      - type: POTION
        effect: fire_resistance
        amplifier: 0
