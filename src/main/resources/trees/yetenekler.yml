# Aktif yetenekler. Her tetik için bir yetenek seçilir (exclusive-with ile sınıf seçimi).
#   Shift + F       -> SNEAK_SWAP      Çift Shift -> DOUBLE_SNEAK      Shift + Zıpla -> SNEAK_JUMP
# Ayrıntılı açıklama: trees/ana.yml başındaki yorumlar.

title: { tr: "<gradient:#FDBA74:#F472B6><b>YETENEKLER</b></gradient>", en: "<gradient:#FDBA74:#F472B6><b>ABILITIES</b></gradient>" }
tab:
  name: { tr: "<white>Yetenekler", en: "<white>Abilities" }
  icon: BLAZE_POWDER
  order: 2

nodes:

  yetenek_kapisi:
    name: { tr: "<gradient:#FDBA74:#FB923C>Yetenek Kapısı</gradient>", en: "<gradient:#FDBA74:#FB923C>Ability Gate</gradient>" }
    icon: BLAZE_ROD
    x: 0
    y: 0
    max-level: 1
    cost: 3
    requires: [baslangic]
    always-visible: true
    color: "#F97316"
    description:
      tr:
        - "<gray>Aktif yeteneklerin"
        - "<gray>kilidini açar."
      en:
        - "<gray>Unlocks the"
        - "<gray>active abilities."
    effects:
      - type: ATTRIBUTE
        attribute: attack_damage
        amount: 0.25

  atilma:
    name: { tr: "<#FDBA74>Atılma", en: "<#FDBA74>Dash" }
    icon: WIND_CHARGE
    x: 1
    y: 0
    max-level: 3
    cost: 5
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [hiz_patlamasi]
    color: "#F97316"
    description:
      tr:
        - "<white>Shift + F</white><gray>: baktığın"
        - "<gray>yöne hızla atıl."
      en:
        - "<white>Shift + F</white><gray>: dash in the"
        - "<gray>direction you look."
    bonus: { tr: "Güç {value}", en: "Power {value}" }
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: DASH
        trigger: SNEAK_SWAP
        cooldown: 14
        cooldown-per-level: -2
        power: 1
        power-per-level: 0.3

  hiz_patlamasi:
    name: { tr: "<#FDBA74>Hız Patlaması", en: "<#FDBA74>Speed Burst" }
    icon: SUGAR
    x: 0.5
    y: -1
    max-level: 3
    cost: 5
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [atilma]
    color: "#F97316"
    description:
      tr:
        - "<white>Shift + F</white><gray>: kısa süre"
        - "<gray>hızlı koş."
        - "<gray>Sv.1 Hız I, Sv.2+ Hız II"
      en:
        - "<white>Shift + F</white><gray>: run fast"
        - "<gray>for a short time."
        - "<gray>Lv.1 Speed I, Lv.2+ Speed II"
    effects:
      - type: ABILITY
        ability: SPEED
        trigger: SNEAK_SWAP
        cooldown: 35
        cooldown-per-level: -5
        power: 0
        power-per-level: 0.5

  sicrama:
    name: { tr: "<#F0ABFC>Sıçrama", en: "<#F0ABFC>Leap" }
    icon: GOAT_HORN
    x: -1
    y: 0
    max-level: 3
    cost: 5
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [sok_dalgasi]
    color: "#D946EF"
    description:
      tr:
        - "<white>Shift + Zıpla</white><gray>: havaya"
        - "<gray>fırla, düşme hasarı yok."
      en:
        - "<white>Shift + Jump</white><gray>: launch into"
        - "<gray>the air, no fall damage."
    bonus: { tr: "Güç {value}", en: "Power {value}" }
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: LEAP
        trigger: SNEAK_JUMP
        cooldown: 15
        cooldown-per-level: -3
        power: 1
        power-per-level: 0.4

  sok_dalgasi:
    name: { tr: "<#F0ABFC>Şok Dalgası", en: "<#F0ABFC>Shockwave" }
    icon: TNT
    x: -0.5
    y: -1
    max-level: 3
    cost: 6
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [sicrama]
    color: "#D946EF"
    description:
      tr:
        - "<white>Shift + Zıpla</white><gray>: yakındaki"
        - "<gray>canavarları savur."
      en:
        - "<white>Shift + Jump</white><gray>: knock back"
        - "<gray>nearby monsters."
    bonus: { tr: "Güç {value}", en: "Power {value}" }
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: NOVA
        trigger: SNEAK_JUMP
        cooldown: 25
        cooldown-per-level: -4
        power: 1
        power-per-level: 0.5

  sifa:
    name: { tr: "<#86EFAC>Şifa", en: "<#86EFAC>Heal" }
    icon: GLISTERING_MELON_SLICE
    x: 0.5
    y: 1
    max-level: 3
    cost: 6
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [kalkan]
    color: "#10B981"
    description:
      tr:
        - "<white>Çift Shift</white><gray>: canını"
        - "<gray>hemen doldur."
        - "<gray>Sv.1 2 ❤, Sv.2 2.5 ❤, Sv.3 3 ❤"
      en:
        - "<white>Double Shift</white><gray>: heal"
        - "<gray>right away."
        - "<gray>Lv.1 2 ❤, Lv.2 2.5 ❤, Lv.3 3 ❤"
    effects:
      - type: ABILITY
        ability: HEAL
        trigger: DOUBLE_SNEAK
        cooldown: 45
        cooldown-per-level: -6
        power: 1
        power-per-level: 0.25

  kalkan:
    name: { tr: "<#86EFAC>Kalkan", en: "<#86EFAC>Shield" }
    icon: SHIELD
    x: -0.5
    y: 1
    max-level: 3
    cost: 6
    cost-increase: 3
    requires: [yetenek_kapisi]
    exclusive-with: [sifa]
    color: "#10B981"
    description:
      tr:
        - "<white>Çift Shift</white><gray>: kısa süre"
        - "<gray>ekstra can ve direnç."
        - "<gray>Sv.1 +2 ❤, Sv.2+ +4 ❤ kalkan"
      en:
        - "<white>Double Shift</white><gray>: extra health"
        - "<gray>and resistance for a while."
        - "<gray>Lv.1 +2 ❤, Lv.2+ +4 ❤ shield"
    effects:
      - type: ABILITY
        ability: SHIELD
        trigger: DOUBLE_SNEAK
        cooldown: 40
        cooldown-per-level: -5
        power: 1
        power-per-level: 0.5

  savasci:
    name: { tr: "<#FDBA74>Usta Savaşçı", en: "<#FDBA74>Master Fighter" }
    icon: MACE
    x: 2
    y: 0
    max-level: 3
    cost: 8
    cost-increase: 4
    requires-any: [atilma, hiz_patlamasi]
    color: "#EA580C"
    description:
      tr:
        - "<gray>Hareket ederken daha"
        - "<gray>sık kritik vurursun."
      en:
        - "<gray>You land critical hits"
        - "<gray>more often while moving."
    bonus: { tr: "%{value} kritik", en: "{value}% crit" }
    bonus-multiplier: 100
    effects:
      - type: CRIT
        amount: 0.03
        multiplier: 1.5

  ruh:
    name: { tr: "<#F0ABFC>Rüzgâr Ruhu", en: "<#F0ABFC>Wind Spirit" }
    icon: ELYTRA
    x: -2
    y: 0
    max-level: 3
    cost: 8
    cost-increase: 4
    requires-any: [sicrama, sok_dalgasi]
    color: "#C026D3"
    description:
      tr:
        - "<gray>Düşüşlerin hafifler,"
        - "<gray>daha güvenli inersin."
      en:
        - "<gray>Your falls are softer,"
        - "<gray>you land more safely."
    bonus: { tr: "+{value} güvenli düşüş", en: "+{value} safe fall" }
    effects:
      - type: ATTRIBUTE
        attribute: safe_fall_distance
        amount: 1

  kutsal_isik:
    name: { tr: "<gradient:#6EE7B7:#A7F3D0><b>Kutsal Işık</b></gradient>", en: "<gradient:#6EE7B7:#A7F3D0><b>Holy Light</b></gradient>" }
    icon: BEACON
    x: 0
    y: 2
    max-level: 1
    cost: 20
    requires-any: [sifa, kalkan]
    color: "#059669"
    description:
      tr:
        - "<gray>Kalıcı yenilenme."
      en:
        - "<gray>Permanent regeneration."
    effects:
      - type: POTION
        effect: regeneration
        amplifier: 0
