# Gathering: mining, wood and farming. Vein mining and tree felling work while sneaking.
# Every setting is explained at the top of trees/main.yml.

title: "<b>GATHERER</b>"
tab:
  name: "<hi>Gatherer"
  icon: GOLDEN_PICKAXE
  order: 3

nodes:

  gatherer:
    name: "Gatherer"
    icon: GOLDEN_PICKAXE
    x: 0
    y: 0
    max-level: 3
    cost: 3
    cost-increase: 2
    requires: [miner]
    always-visible: true
    color: "#A0702A"
    description:
      - "<body>Your pickaxes work"
      - "<body>more efficiently."
    bonus: "+{value} efficiency"
    effects:
      - type: ATTRIBUTE
        attribute: mining_efficiency
        amount: 1

  vein_hunter:
    name: "Vein Hunter"
    icon: DIAMOND_PICKAXE
    x: 1
    y: 0
    max-level: 4
    cost: 5
    cost-increase: 3
    requires: [gatherer]
    color: "#B98433"
    description:
      - "<hi>Sneak</hi> <body>and break an ore,"
      - "<body>the whole vein breaks too."
    bonus: "+{value} blocks"
    effects:
      - type: VEIN_MINER
        amount: 4

  molten_pickaxe:
    name: "Molten Pickaxe"
    icon: BLAST_FURNACE
    x: 2
    y: 0
    max-level: 4
    cost: 5
    cost-increase: 2
    requires: [vein_hunter]
    color: "#B98433"
    description:
      - "<body>Ores melt into ingots"
      - "<body>as you break them."
    bonus: "{value}% chance"
    bonus-multiplier: 100
    effects:
      - type: AUTO_SMELT
        amount: 0.25

  need_for_speed:
    name: "Need for Speed"
    icon: GOLDEN_SHOVEL
    x: 0.5
    y: -1
    max-level: 2
    cost: 8
    cost-increase: 8
    requires: [gatherer]
    color: "#B98433"
    description:
      - "<body>Permanent <value>Haste I</value> and"
      - "<body>faster mining."
    bonus: "+{value}% mining speed"
    bonus-multiplier: 100
    effects:
      - type: ATTRIBUTE
        attribute: block_break_speed
        amount: 0.05
        operation: ADD_SCALAR
      - type: POTION
        effect: haste
        amplifier: 0

  lucky_rod:
    name: "Lucky Rod"
    icon: FISHING_ROD
    x: -0.5
    y: -1
    max-level: 3
    cost: 3
    cost-increase: 2
    requires: [gatherer]
    color: "#4F829A"
    description:
      - "<body>Better loot"
      - "<body>when fishing."
    bonus: "+{value} luck"
    bonus-per-level: 0.5
    effects:
      - type: ATTRIBUTE
        attribute: luck
        amount: 0.5

  lumberjack:
    name: "Lumberjack"
    icon: IRON_AXE
    x: -1
    y: 0
    max-level: 4
    cost: 4
    cost-increase: 2
    requires: [gatherer]
    color: "#66802B"
    description:
      - "<hi>Sneak</hi> <body>and break a log,"
      - "<body>the whole tree falls."
    bonus: "+{value} logs"
    effects:
      - type: TREE_FELLER
        amount: 16

  forest_keeper:
    name: "Forest Keeper"
    icon: OAK_SAPLING
    x: -2
    y: 0
    max-level: 3
    cost: 4
    cost-increase: 2
    requires: [lumberjack]
    color: "#66802B"
    description:
      - "<body>A chance for double"
      - "<body>wood from logs."
    bonus: "{value}% chance"
    bonus-multiplier: 100
    effects:
      - type: DOUBLE_DROP
        amount: 0.1
        blocks: ["#logs"]

  bounty:
    name: "Bounty"
    icon: WHEAT
    x: 0.5
    y: 1
    max-level: 4
    cost: 3
    cost-increase: 2
    requires: [gatherer]
    color: "#557232"
    description:
      - "<body>A chance for double"
      - "<body>crops from ripe plants."
    bonus: "{value}% chance"
    bonus-multiplier: 100
    effects:
      - type: DOUBLE_DROP
        amount: 0.08
        blocks: [WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART, COCOA]

  green_thumb:
    name: "Green Thumb"
    icon: MELON_SLICE
    x: -0.5
    y: 1
    max-level: 3
    cost: 3
    cost-increase: 2
    requires: [gatherer]
    color: "#557232"
    description:
      - "<body>Double drops from melons,"
      - "<body>pumpkins and sugar cane."
    bonus: "{value}% chance"
    bonus-multiplier: 100
    effects:
      - type: DOUBLE_DROP
        amount: 0.08
        blocks: [MELON, PUMPKIN, SUGAR_CANE, CACTUS, BAMBOO, SWEET_BERRY_BUSH]
