# Active abilities. One ability per trigger (exclusive-with makes it a class choice).
#   Sneak + F -> SNEAK_SWAP      Sneak twice -> DOUBLE_SNEAK      Sneak + Jump -> SNEAK_JUMP
# Every setting is explained at the top of trees/main.yml.

title: "<b>ABILITIES</b>"
tab:
  name: "<hi>Abilities"
  icon: BLAZE_POWDER
  order: 2

nodes:

  ability_gate:
    name: "Ability Gate"
    icon: BLAZE_ROD
    x: 0
    y: 0
    max-level: 1
    cost: 3
    requires: [origin]
    always-visible: true
    color: "#B8692F"
    description:
      - "<body>Unlocks the"
      - "<body>active abilities."
    effects:
      - type: ATTRIBUTE
        attribute: attack_damage
        amount: 0.25

  dash:
    name: "Dash"
    icon: WIND_CHARGE
    x: 1
    y: 0
    max-level: 3
    cost: 5
    cost-increase: 3
    requires: [ability_gate]
    exclusive-with: [speed_burst]
    color: "#B8692F"
    description:
      - "<hi>Shift + F</hi><body>: dash in the"
      - "<body>direction you look."
    bonus: "Power {value}"
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: DASH
        trigger: SNEAK_SWAP
        cooldown: 14
        cooldown-per-level: -2
        power: 1
        power-per-level: 0.3

  speed_burst:
    name: "Speed Burst"
    icon: SUGAR
    x: 0.5
    y: -1
    max-level: 3
    cost: 5
    cost-increase: 3
    requires: [ability_gate]
    exclusive-with: [dash]
    color: "#B8692F"
    description:
      - "<hi>Shift + F</hi><body>: run fast"
      - "<body>for a short time."
      - "<body>Lv.1 Speed I, Lv.2+ Speed II"
    effects:
      - type: ABILITY
        ability: SPEED
        trigger: SNEAK_SWAP
        cooldown: 35
        cooldown-per-level: -5
        power: 0
        power-per-level: 0.5

  leap:
    name: "Leap"
    icon: GOAT_HORN
    x: -1
    y: 0
    max-level: 3
    cost: 5
    cost-increase: 3
    requires: [ability_gate]
    exclusive-with: [shockwave]
    color: "#8E5287"
    description:
      - "<hi>Shift + Jump</hi><body>: launch into"
      - "<body>the air, no fall damage."
    bonus: "Power {value}"
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: LEAP
        trigger: SNEAK_JUMP
        cooldown: 15
        cooldown-per-level: -3
        power: 1
        power-per-level: 0.4

  shockwave:
    name: "Shockwave"
    icon: TNT
    x: -0.5
    y: -1
    max-level: 3
    cost: 6
    cost-increase: 3
    requires: [ability_gate]
    exclusive-with: [leap]
    color: "#8E5287"
    description:
      - "<hi>Shift + Jump</hi><body>: knock back"
      - "<body>nearby monsters."
    bonus: "Power {value}"
    bonus-per-level: 1
    effects:
      - type: ABILITY
        ability: NOVA
        trigger: SNEAK_JUMP
        cooldown: 25
        cooldown-per-level: -4
        power: 1
        power-per-level: 0.5

  heal:
    name: "Heal"
    icon: GLISTERING_MELON_SLICE
    x: 0.5
    y: 1
    max-level: 3
    cost: 6
    cost-increase: 3
    requires: [ability_gate]
    exclusive-with: [shield]
    color: "#4C8466"
    description:
      - "<hi>Double Shift</hi><body>: heal"
      - "<body>right away."
      - "<body>Lv.1 2 ❤, Lv.2 2.5 ❤, Lv.3 3 ❤"
    effects:
      - type: ABILITY
        ability: HEAL
        trigger: DOUBLE_SNEAK
        cooldown: 45
        cooldown-per-level: -6
        power: 1
        power-per-level: 0.25

  shield:
    name: "Shield"
    icon: SHIELD
    x: -0.5
    y: 1
    max-level: 3
    cost: 6
    cost-increase: 3
    requires: [ability_gate]
    exclusive-with: [heal]
    color: "#4C8466"
    description:
      - "<hi>Double Shift</hi><body>: extra health"
      - "<body>and resistance for a while."
      - "<body>Lv.1 +2 ❤, Lv.2+ +4 ❤ shield"
    effects:
      - type: ABILITY
        ability: SHIELD
        trigger: DOUBLE_SNEAK
        cooldown: 40
        cooldown-per-level: -5
        power: 1
        power-per-level: 0.5

  master_fighter:
    name: "Master Fighter"
    icon: MACE
    x: 2
    y: 0
    max-level: 3
    cost: 8
    cost-increase: 4
    requires-any: [dash, speed_burst]
    color: "#A85A28"
    description:
      - "<body>You land critical hits"
      - "<body>more often while moving."
    bonus: "{value}% crit"
    bonus-multiplier: 100
    effects:
      - type: CRIT
        amount: 0.03
        multiplier: 1.5

  wind_spirit:
    name: "Wind Spirit"
    icon: ELYTRA
    x: -2
    y: 0
    max-level: 3
    cost: 8
    cost-increase: 4
    requires-any: [leap, shockwave]
    color: "#7E4479"
    description:
      - "<body>Your falls are softer,"
      - "<body>you land more safely."
    bonus: "+{value} safe fall"
    effects:
      - type: ATTRIBUTE
        attribute: safe_fall_distance
        amount: 1

  holy_light:
    name: "<b>Holy Light</b>"
    icon: BEACON
    x: 0
    y: 2
    max-level: 1
    cost: 20
    requires-any: [heal, shield]
    color: "#3F7158"
    description:
      - "<body>Permanent regeneration."
    effects:
      - type: POTION
        effect: regeneration
        amplifier: 0
