# UpgradeTree messages. MiniMessage format: <b>, <#FF8800>, <red> ...
# Legacy & colour codes (&a, &l, &#FF8800) work too. After changes: /tigo reload
# Colour names follow the chosen style (config.yml menu.style):
#   <hi> heading  <body> text  <dim> faint  <accent> accent  <value> value  <bad> error  <good> success  <info> info  <magic> magic
# A key missing here falls back to the built-in text.
# messages-version: when the built-in texts change a lot, an older copy of this file is kept as a
# backup (messages.yml.v<n>.bak) and replaced. Do not edit this number.
messages-version: 1

prefix: "<dim>[</dim><accent>Tree</accent><dim>]</dim> "
no-permission: "<bad>You don't have permission to do that."
players-only: "<bad>Only players can use this command."
