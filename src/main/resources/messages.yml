disabled-world: "<bad>Upgrades are disabled in this world."
opened-hint: "<body>Aim at an upgrade with your crosshair, <hi>left click</hi> to buy. The panel stays put, you can walk freely. <hi>Look at it and sneak</hi> to close."
reloaded: "<good>Configuration reloaded. <body>({trees} trees, {nodes} upgrades)"
reload-failed: "<bad>Reload failed, check the console."
reset-done: "<good>All upgrades of <hi>{player}</hi> were reset."
set-done: "<good><hi>{player}</hi>: <hi>{node}</hi> → level <value>{level}</value>"
points-done: "<good><hi>{player}</hi> now has <value>{points}</value> points."
points-not-used: "<value>Note: the currency is not POINTS, points are not used right now."
prestige-set: "<good><hi>{player}</hi> prestige: <value>{level}</value>"

