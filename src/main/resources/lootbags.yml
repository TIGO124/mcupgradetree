# ============================================================
#  Loot bags – every mob killed by a player has a chance to drop a loot bag.
#  Hostile mobs (monsters) drop them hostile-multiplier times as often as the others.
#  Right click a bag to open it: 5-10 different items, better ones in rarer bags.
#  After changes: /tigo reload   ·   Check for mistakes: /tigo check
#  Admins: /tigo lootbag give <player> <rarity> [amount]
# ============================================================
#
# RARITY SETTINGS (the key, e.g. "rare", is the id used by commands):
#   name     : Name of the bag item (MiniMessage)
#   color    : #RRGGBB, colour of the sparkles when the bag drops and opens
#   chance   : Percent chance per non-hostile mob (animals, villagers, golems...) killed by a player.
#              Hostile mobs: chance × hostile-multiplier. The same for every mob of a kind.
#   model    : Look of the bag, any item model (no resource pack needed), e.g. minecraft:purple_bundle
#   glint    : Enchantment shine on the bag
#   glow     : A dropped bag glows (outline through walls)
#   announce : The whole server is told when someone finds this bag (and its opening gets a title)
#   items    : (optional) how many different items this bag holds, e.g. 6-10 (default: "items" below)
#   loot     : What can be inside. Every entry is one of:
#              item: DIAMOND, amount: 2-5 (or 3), name: "<value>Name", lore: [...], enchantments: { sharpness: 5 }
#              levels: 3-6   (gives XP levels)
#              weight: how often the entry is picked compared to the others (default 1)
#              A bag never holds the same entry twice.

enabled: true
# Hostile mobs drop bags this many times as often as other mobs
hostile-multiplier: 2.0
# How many different items a bag holds
items: 5-10
# Show the name of a dropped bag above it
show-name: true
# Mobs spawned these ways never drop bags (farm protection). Baby animals never drop bags either,
# and no mob does in the restrictions.disabled-worlds of config.yml.
ignored-spawn-reasons:
  - SPAWNER
  - SPAWNER_EGG
  - DISPENSE_EGG
  - SLIME_SPLIT
  - BUILD_IRONGOLEM
  - BUILD_SNOWMAN

